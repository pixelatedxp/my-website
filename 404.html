<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pixelis.dev</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">

    <script>
        (function() {
            if (sessionStorage.getItem('404_redirected')) { return; }
            var path = window.location.pathname;
            if (path.endsWith('/index.html')) { return; }
            if (path.match(/\.[a-zA-Z0-9]+$/)) { return; }
            sessionStorage.setItem('404_redirected', '1');
            var redirect = path.replace(/\/?$/, '/') + 'index.html';
            if (redirect !== path) {
                window.location.replace(redirect);
            }
        })();
    </script>

    <style>
        .error-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        .error-box {
            max-width: 500px;
            width: 100%;
        }

        .huge-404 {
            font-size: 8rem;
            line-height: 1;
            margin-bottom: 20px;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .error-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.6;
        }
    </style>
</head>
<body class="dark-mode">

    <div class="cursor-trail">

        <div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div><div class="circle"></div>

                    <path d="M12 2v4m0 12v4M4 12H2m20 0h-2M5.64 5.64l2.83 2.83m7.07 7.07l2.83 2.83M5.64 18.36l2.83-2.83m7.07-7.07l2.83-2.83M12 8a4 4 0 100 8 4 4 0 000-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>

    <main class="container error-container fade-up-initial">
        <div class="error-box">
            <h1 class="huge-404 mono-label glitch-text" data-text="404">404</h1>

            <div class="glow-card tiltable" style="text-align: left;">
                <div class="glow-content" style="padding: 40px 30px; text-align: center;">

                    <a href="index.html" style="text-decoration: none; display: inline-block;">
