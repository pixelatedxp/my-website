    <script>
        (function() {
            if (sessionStorage.getItem('404_redirected')) { return; }
            var path = window.location.pathname;
            if (path.endsWith('/index.html')) { return; }
            if (path.match(/\.[a-zA-Z0-9]+$/)) { return; }
            sessionStorage.setItem('404_redirected', '1');
            var redirect = path.replace(/\/?$/, '/') + 'index.html';
            if (redirect !== path) {
                window.location.replace(redirect);
            }
        })();
    </script>
