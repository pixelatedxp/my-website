<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lost - pixelis.dev</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f3f6fa">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@600;700&family=Outfit:wght@400;500;600;700;800&family=Space+Mono&family=VT323&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/assets/favicon.png">
    <link rel="stylesheet" href="/site.css?v=2">
    <script>
        // Folder URLs without a trailing index.html (e.g. /games/chess) get one retry.
        (function () {
            try { if (sessionStorage.getItem('404_redirected')) return; } catch (e) { return; }
            var path = window.location.pathname;
            if (path.endsWith('/index.html') || /\.[a-zA-Z0-9]+$/.test(path)) return;
            try { sessionStorage.setItem('404_redirected', '1'); } catch (e) {}
            var redirect = path.replace(/\/?$/, '/') + 'index.html';
            if (redirect !== path) window.location.replace(redirect);
        })();
    </script>
</head>
<body>
    <header class="site-header wrap">
        <div class="brand-row">
            <a class="logo" href="/index.html" aria-label="pixelis.dev home">
                <span class="logo-word" aria-hidden="true">pixelis</span><span class="logo-tag" aria-hidden="true">.dev</span>
            </a>
            <a class="legacy-badge" href="/legacy/index.html" title="the old pixelis.dev, with everything still working"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>legacy site</a>
        </div>
        <nav class="site-nav" aria-label="Main">
            <a href="/games/index.html">games</a>
            <a href="/index.html#friends">friends</a>
            <a href="https://github.com/pixelatedxp/my-website">source</a>
        </nav>
    </header>
    <main class="wrap lost">
        <span class="big" aria-hidden="true">404</span>
        <h1 class="h2">this page got lost in the mail.</h1>
        <p class="hand muted" style="font-size: 28px; margin: 0">either it never existed or i deleted it at 3am.</p>
        <a class="btn btn-yellow" href="/index.html">take me home</a>
    </main>
    <footer class="site-footer wrap">
        <span class="hand">built with poor judgment</span>
    </footer>
    <script>try { sessionStorage.removeItem('404_redirected'); } catch (e) {}</script>
</body>
</html>
